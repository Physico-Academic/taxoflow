name: Publish release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter requirements
        run: python -m pip install -r requirements.txt
      - name: Validate source and release metadata
        run: |
          node --check main.js
          python tools/validate_release.py
          npm test
      - name: Verify release tag matches manifest version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Manifest version $manifest_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create GitHub release with Obsidian assets
        uses: softprops/action-gh-release@v2
        with:
          name: TaxoFlow Properties ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
