name: Bug report
description: Report a reproducible problem in TaxoFlow Properties
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TaxoFlow Properties version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or other context
      description: Remove personal data and private vault content before sharing.
    validations:
      required: false
